<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>3D Kidney Model</title>

  <style>
    body { margin: 0; overflow: hidden; font-family: Arial; background: #0f172a; color: white; }

    header {
      position: absolute;
      top: 10px;
      width: 100%;
      text-align: center;
      font-size: 24px;
      z-index: 2;
    }

    button {
      position: absolute;
      top: 60px;
      left: 20px;
      padding: 10px;
      background: #00ffcc;
      border: none;
      cursor: pointer;
      z-index: 2;
    }

    .label {
      position: absolute;
      color: #00ffcc;
      background: rgba(0,0,0,0.6);
      padding: 4px;
      border-radius: 5px;
      z-index: 2;
    }

    .slide {
      position: absolute;
      width: 100%;
      height: 100%;
      display: none;
    }

    .active { display: block; }

    #functionsSlide {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
  </style>
</head>

<body>

<header>🧬 Kidney 3D Learning</header>

<button onclick="showFunctions()">View Functions</button>

<div id="modelSlide" class="slide active">
  <div id="label1" class="label">Kidney</div>
</div>

<div id="functionsSlide" class="slide">
  <h1>Kidney Functions</h1>
  <p>✔ Filters blood</p>
  <p>✔ Removes waste</p>
  <p>✔ Controls water balance</p>
  <p>✔ Produces urine</p>
  <button onclick="showModel()">⬅ Back</button>
</div>

<!-- Three.js -->
<script src="https://cdn.jsdelivr.net/npm/three@0.128/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/loaders/GLTFLoader.js"></script>

<script>
function showFunctions() {
  document.getElementById("modelSlide").classList.remove("active");
  document.getElementById("functionsSlide").classList.add("active");
}

function showModel() {
  document.getElementById("functionsSlide").classList.remove("active");
  document.getElementById("modelSlide").classList.add("active");
}

// Scene
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0f172a);

// Camera
const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.set(0, 0, 5);

// Renderer
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.getElementById("modelSlide").appendChild(renderer.domElement);

// Controls
const controls = new THREE.OrbitControls(camera, renderer.domElement);

// Lighting
scene.add(new THREE.AmbientLight(0xffffff, 1));
const light = new THREE.DirectionalLight(0xffffff, 2);
light.position.set(5,5,5);
scene.add(light);

// Load Model (WORKING MODEL)
const loader = new THREE.GLTFLoader();

loader.load(
  "https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0/Duck/glTF-Binary/Duck.glb",
  function(gltf) {
    const model = gltf.scene;

    model.scale.set(2,2,2);

    const box = new THREE.Box3().setFromObject(model);
    const center = box.getCenter(new THREE.Vector3());
    model.position.sub(center);

    scene.add(model);
  }
);

// Animation
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

// Resize fix
window.addEventListener("resize", () => {
  renderer.setSize(window.innerWidth, window.innerHeight);
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
});
</script>

</body>
</html>
